name: Google Shopping trial

# Manual, one-off (owner, 2026-11-11): measures which big stores DataForSEO's Google Shopping data covers for the products we
# list in AU, US and UK, on DataForSEO's free trial credit (hard cap US$0.60 by each task's own cost). Writes
# docs/shopping-trial/<date>.json and commits it; no price from it reaches a page. Needs DATAFORSEO_LOGIN / DATAFORSEO_PASSWORD
# (the API login and API password from app.dataforseo.com, Account, API Access).
on:
  workflow_dispatch:
    inputs:
      per_region:
        description: Searches per region
        default: "40"

permissions:
  contents: write

concurrency: shopping-trial

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the trial
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          SHOPPING_TRIAL_PER_REGION: ${{ inputs.per_region }}
        run: npx tsx scripts/shopping-trial.ts
      - name: Commit the report
        run: |
          git config user.name "compare-empire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/shopping-trial
          if git diff --cached --quiet; then echo "No report"; exit 0; fi
          git commit -m "data: Google Shopping trial report"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
