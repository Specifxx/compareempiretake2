name: Amazon ASINs

# Runs the Creators API ASIN finder on its own, by hand, for the regions named (owner, 2026-11-06: switch on the US
# Amazon rows as soon as the US credential exists instead of waiting for the next daily import). Commits only
# data/amazon/ (ASINs and status; prices are never committed) and carries no deploy marker: the next build fetches
# the prices for the ASINs found.
on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Regions to search (space separated: au us uk ca)"
        default: "us"
      budget:
        description: "Searches per region (one a second)"
        default: "400"

permissions:
  contents: write

concurrency: amazon-asins

jobs:
  asins:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Amazon ASINs (Creators API)
        env:
          AMAZON_REGIONS: ${{ inputs.regions }}
          AMAZON_SEARCH_BUDGET: ${{ inputs.budget }}
          AMAZON_CREATORS_AU_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_AU_CLIENT_ID }}
          AMAZON_CREATORS_AU_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_AU_CLIENT_SECRET }}
          AMAZON_CREATORS_AU_VERSION: ${{ secrets.AMAZON_CREATORS_AU_VERSION }}
          AMAZON_CREATORS_US_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_US_CLIENT_ID }}
          AMAZON_CREATORS_US_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_US_CLIENT_SECRET }}
          AMAZON_CREATORS_US_VERSION: ${{ secrets.AMAZON_CREATORS_US_VERSION }}
          AMAZON_CREATORS_UK_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_UK_CLIENT_ID }}
          AMAZON_CREATORS_UK_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_UK_CLIENT_SECRET }}
          AMAZON_CREATORS_UK_VERSION: ${{ secrets.AMAZON_CREATORS_UK_VERSION }}
          AMAZON_CREATORS_CA_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CA_CLIENT_ID }}
          AMAZON_CREATORS_CA_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CA_CLIENT_SECRET }}
          AMAZON_CREATORS_CA_VERSION: ${{ secrets.AMAZON_CREATORS_CA_VERSION }}
        run: npx tsx scripts/amazon-asins.ts
      - name: Commit ASINs
        run: |
          git config user.name "compare-empire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/amazon
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: Amazon ASINs (${{ inputs.regions }})"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 10; done
          exit 1
