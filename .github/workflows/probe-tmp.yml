name: Probe router stores (temporary)
on:
  push:
    branches: [claude/project-thread-jzddps]
    paths: [.github/workflows/probe-tmp.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          for b in https://www.gl-inet.com https://firewalla.com https://store.amplifi.com https://www.cudy.com; do
            echo "== $b"; curl -s -A "$UA" -m 20 "$b/meta.json" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('currency'),d.get('country'),d.get('name'))" || true
            curl -s -A "$UA" -m 20 "$b/products.json?limit=250" -o /tmp/p.json || true
            python3 - <<'P' || true
          import json
          p=json.load(open('/tmp/p.json'))['products']
          for x in p[:60]:
              v=x['variants'][0]
              print(f"  {x.get('product_type','')[:22]:22} | {x['title'][:70]:70} | {v['price']} | {v.get('sku')} | {v['available']} | {len(x['variants'])}v")
          P
          done
