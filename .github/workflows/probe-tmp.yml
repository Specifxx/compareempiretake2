name: Probe router stores (temporary)
on:
  push:
    branches: [claude/project-thread-jzddps]
    paths: [.github/workflows/probe-tmp.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/scrape-categories.ts --region us --cat routers glinet firewalla amplifi
      - run: |
          for f in data/us/routers/raw/us-glinet.json data/us/routers/raw/us-firewalla.json data/us/routers/raw/us-amplifi.json; do
            python3 -c "import json,sys;d=json.load(open('$f'));[print(o['price'],o['inStock'],o.get('mpn'),o['title'][:80]) for o in d['offers']]" || true
          done
      - run: npx tsx scripts/build-catalog.ts --region us routers && python3 -c "import json;d=json.load(open('data/us/routers/catalog.json'));p=d.get('products') or d.get('phones') or d;print(type(p), len(p))"
