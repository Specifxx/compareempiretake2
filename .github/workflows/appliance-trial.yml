name: Appliance trial scrape (temporary)
# Scrapes only the new appliance categories and commits their data to this branch, so the
# categories go live with real prices on merge. Removed before merge.
on:
  push:
    branches: [claude/project-thread-ss5ocm]
    paths: [scripts/probe/trial.txt]
permissions:
  contents: write
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape the appliance categories
        continue-on-error: true
        env:
          JB_BUDGET_MIN: "45"
        run: |
          for c in vacuums air-fryers coffee-machines fridges washing-machines dishwashers; do
            npx tsx scripts/scrape-categories.ts --cat $c || true
          done
      - name: Build their catalogues
        run: npx tsx scripts/build-catalog.ts vacuums air-fryers coffee-machines fridges washing-machines dishwashers
      - name: Commit
        run: |
          git config user.name "compare-empire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "data: first appliance prices" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
