name: Backfill price history from the Internet Archive

# Run by hand (Actions tab → this workflow → Run workflow). Safe to rerun:
# product pages already checked are skipped.
on:
  workflow_dispatch:
    inputs:
      category:
        description: "Category (phones, tablets, laptops, monitors, graphics-cards, tvs)"
        required: false
        default: "phones"
      retailers:
        description: "Stores to backfill (space separated, blank = all supported)"
        required: false
        default: ""

permissions:
  contents: write

concurrency: refresh-prices

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backfill
        run: npx tsx scripts/backfill-archive.ts --cat "${{ inputs.category }}" ${{ inputs.retailers }}
      - name: Rebuild catalogue
        if: always()
        run: npm run build:catalog
      - name: Commit data
        if: always()
        run: |
          git config user.name "compare-empire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: price history backfilled from the Internet Archive"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
