name: Refresh prices

# Every morning (06:10 Sydney ≈ 19:10/20:10 UTC) scrape all retailers, rebuild
# data/catalog.json and commit it. The push to main triggers one Vercel build.
on:
  schedule:
    - cron: "10 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh-prices

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape phones
        run: npm run scrape
      - name: Scrape tablets, laptops, monitors, graphics cards and TVs
        # One broken store must not stop the others or the phone update.
        continue-on-error: true
        # The big chains' affiliate-network feeds (docs/stores/big-stores.md): a store runs only once its secret exists.
        env:
          # JB Hi-Fi's product reads: 40 minutes left half its categories on week-old files (2026-11-05).
          JB_BUDGET_MIN: "60"
          FEED_URL_OFFICEWORKS: ${{ secrets.FEED_URL_OFFICEWORKS }}
          FEED_URL_BIGW: ${{ secrets.FEED_URL_BIGW }}
          FEED_URL_KOGAN: ${{ secrets.FEED_URL_KOGAN }}
          FEED_URL_CATCH: ${{ secrets.FEED_URL_CATCH }}
          FEED_URL_BINGLEE: ${{ secrets.FEED_URL_BINGLEE }}
          FEED_URL_MYER: ${{ secrets.FEED_URL_MYER }}
          FEED_URL_DAVIDJONES: ${{ secrets.FEED_URL_DAVIDJONES }}
          FEED_URL_TARGETAU: ${{ secrets.FEED_URL_TARGETAU }}
          FEED_URL_KMART: ${{ secrets.FEED_URL_KMART }}
          FEED_URL_BUNNINGS: ${{ secrets.FEED_URL_BUNNINGS }}
        run: npx tsx scripts/scrape-categories.ts
      - name: Scrape US stores
        continue-on-error: true
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          FEED_URL_US_BESTBUY: ${{ secrets.FEED_URL_US_BESTBUY }}
          FEED_URL_US_WALMART: ${{ secrets.FEED_URL_US_WALMART }}
          FEED_URL_US_TARGET: ${{ secrets.FEED_URL_US_TARGET }}
          FEED_URL_US_HOMEDEPOT: ${{ secrets.FEED_URL_US_HOMEDEPOT }}
          FEED_URL_US_LOWES: ${{ secrets.FEED_URL_US_LOWES }}
          FEED_URL_US_NEWEGG: ${{ secrets.FEED_URL_US_NEWEGG }}
          FEED_URL_US_BHPHOTO: ${{ secrets.FEED_URL_US_BHPHOTO }}
          FEED_URL_US_ADORAMA: ${{ secrets.FEED_URL_US_ADORAMA }}
          FEED_URL_US_STAPLES: ${{ secrets.FEED_URL_US_STAPLES }}
          FEED_URL_US_GAMESTOP: ${{ secrets.FEED_URL_US_GAMESTOP }}
          FEED_URL_US_SAMSCLUB: ${{ secrets.FEED_URL_US_SAMSCLUB }}
          FEED_URL_US_CRUTCHFIELD: ${{ secrets.FEED_URL_US_CRUTCHFIELD }}
          FEED_URL_US_COSTCO: ${{ secrets.FEED_URL_US_COSTCO }}
          FEED_URL_US_MICROCENTER: ${{ secrets.FEED_URL_US_MICROCENTER }}
          FEED_URL_US_OFFICEDEPOT: ${{ secrets.FEED_URL_US_OFFICEDEPOT }}
          FEED_URL_US_WILLIAMSSONOMA: ${{ secrets.FEED_URL_US_WILLIAMSSONOMA }}
          FEED_URL_US_KOHLS: ${{ secrets.FEED_URL_US_KOHLS }}
          FEED_URL_US_MACYS: ${{ secrets.FEED_URL_US_MACYS }}
          FEED_URL_US_WAYFAIR: ${{ secrets.FEED_URL_US_WAYFAIR }}
          FEED_URL_US_BJS: ${{ secrets.FEED_URL_US_BJS }}
        run: npx tsx scripts/scrape-categories.ts --region us
      - name: Scrape UK stores
        continue-on-error: true
        env:
          FEED_URL_UK_CURRYS: ${{ secrets.FEED_URL_UK_CURRYS }}
          FEED_URL_UK_ARGOS: ${{ secrets.FEED_URL_UK_ARGOS }}
          FEED_URL_UK_AO: ${{ secrets.FEED_URL_UK_AO }}
          FEED_URL_UK_JOHNLEWIS: ${{ secrets.FEED_URL_UK_JOHNLEWIS }}
          FEED_URL_UK_VERY: ${{ secrets.FEED_URL_UK_VERY }}
          FEED_URL_UK_SCAN: ${{ secrets.FEED_URL_UK_SCAN }}
          FEED_URL_UK_EBUYER: ${{ secrets.FEED_URL_UK_EBUYER }}
          FEED_URL_UK_RICHERSOUNDS: ${{ secrets.FEED_URL_UK_RICHERSOUNDS }}
          FEED_URL_UK_SMYTHS: ${{ secrets.FEED_URL_UK_SMYTHS }}
          FEED_URL_UK_GAME: ${{ secrets.FEED_URL_UK_GAME }}
          FEED_URL_UK_COSTCOUK: ${{ secrets.FEED_URL_UK_COSTCOUK }}
          FEED_URL_UK_ROBERTDYAS: ${{ secrets.FEED_URL_UK_ROBERTDYAS }}
          FEED_URL_UK_LITTLEWOODS: ${{ secrets.FEED_URL_UK_LITTLEWOODS }}
          FEED_URL_UK_THEENTERTAINER: ${{ secrets.FEED_URL_UK_THEENTERTAINER }}
          FEED_URL_UK_HAMLEYS: ${{ secrets.FEED_URL_UK_HAMLEYS }}
          FEED_URL_UK_RYMAN: ${{ secrets.FEED_URL_UK_RYMAN }}
          FEED_URL_UK_JESSOPS: ${{ secrets.FEED_URL_UK_JESSOPS }}
          FEED_URL_UK_MARKSELECTRICAL: ${{ secrets.FEED_URL_UK_MARKSELECTRICAL }}
          FEED_URL_UK_APPLIANCESDIRECT: ${{ secrets.FEED_URL_UK_APPLIANCESDIRECT }}
        run: npx tsx scripts/scrape-categories.ts --region uk
      # Canada and Singapore (2026-11-06): independent stores read by auto-shopify.ts; their pages 404 until they have products.
      - name: Scrape Canadian stores
        continue-on-error: true
        run: npx tsx scripts/scrape-categories.ts --region ca
      - name: Scrape Singapore stores
        continue-on-error: true
        run: npx tsx scripts/scrape-categories.ts --region sg
      - name: Build catalogues
        run: |
          npm run build:catalog
          npx tsx scripts/build-catalog.ts --region us
          npx tsx scripts/build-catalog.ts --region uk
          npx tsx scripts/build-catalog.ts --region ca
          npx tsx scripts/build-catalog.ts --region sg
      - name: eBay prices (Browse API, up to 4,950 calls)
        continue-on-error: true
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          # Search Console page demand, written daily to the `demand` branch by TCGEmpire's sister-demand job.
          EBAY_DEMAND_FILE: ${{ runner.temp }}/gsc-pages.json
        run: |
          git fetch --depth=1 origin demand && git show FETCH_HEAD:gsc-pages.json > "$EBAY_DEMAND_FILE" || echo "No demand branch yet"
          npx tsx scripts/ebay-prices.ts
      # Amazon AU ASINs (Creators API searchItems, AMAZON_SEARCH_BUDGET a day). ASINs only: Amazon prices are
      # fetched by each Vercel build and never committed (DECISIONS.md 2026-11-03). A no-op until the secrets exist.
      - name: Amazon ASINs (Creators API)
        continue-on-error: true
        env:
          AMAZON_CREATORS_AU_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_AU_CLIENT_ID }}
          AMAZON_CREATORS_AU_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_AU_CLIENT_SECRET }}
          AMAZON_CREATORS_AU_VERSION: ${{ secrets.AMAZON_CREATORS_AU_VERSION }}
        run: npx tsx scripts/amazon-asins.ts
      # The Compare Empire network (scripts/family-sync.ts): our best deals and camera pages for CamCompare,
      # and CamCompare's feed for our deals pages and camera hand-offs. Never fatal.
      - name: Family feed
        continue-on-error: true
        run: npx tsx --conditions=react-server scripts/family-sync.ts
      - name: Commit data
        run: |
          git config user.name "compare-empire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: daily prices $(TZ=Australia/Sydney date +%F) [deploy]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Email price-drop alerts
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: npx tsx scripts/send-alerts.ts
      - name: Tell search engines what changed (IndexNow)
        continue-on-error: true
        # Give Vercel a few minutes to deploy the commit first.
        run: sleep 300 && npx tsx scripts/indexnow.ts
