name: Refresh prices

# Every morning (06:10 Sydney ≈ 19:10/20:10 UTC) scrape all retailers, rebuild
# data/catalog.json and commit it. The push to main triggers one Vercel build.
on:
  schedule:
    - cron: "10 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh-prices

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape phones
        run: npm run scrape
      - name: Scrape tablets, laptops, monitors, graphics cards and TVs
        # One broken store must not stop the others or the phone update.
        continue-on-error: true
        run: npx tsx scripts/scrape-categories.ts
      - name: Build catalogues
        run: npm run build:catalog
      - name: Commit data
        run: |
          git config user.name "compare-empire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: daily prices $(TZ=Australia/Sydney date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
