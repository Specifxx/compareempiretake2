name: Refresh prices

# Every morning (06:10 Sydney ≈ 19:10/20:10 UTC) scrape all retailers, rebuild
# data/catalog.json and commit it. The push to main triggers one Vercel build.
on:
  schedule:
    - cron: "10 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh-prices

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape phones
        run: npm run scrape
      - name: Scrape tablets, laptops, monitors, graphics cards and TVs
        # One broken store must not stop the others or the phone update.
        continue-on-error: true
        run: npx tsx scripts/scrape-categories.ts
      - name: Scrape US stores
        continue-on-error: true
        run: npx tsx scripts/scrape-categories.ts --region us
      - name: Scrape UK stores
        continue-on-error: true
        run: npx tsx scripts/scrape-categories.ts --region uk
      - name: Build catalogues
        run: |
          npm run build:catalog
          npx tsx scripts/build-catalog.ts --region us
          npx tsx scripts/build-catalog.ts --region uk
      - name: Commit data
        run: |
          git config user.name "compare-empire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: daily prices $(TZ=Australia/Sydney date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Email price-drop alerts
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: npx tsx scripts/send-alerts.ts
      - name: Tell search engines what changed (IndexNow)
        continue-on-error: true
        # Give Vercel a few minutes to deploy the commit first.
        run: sleep 300 && npx tsx scripts/indexnow.ts
