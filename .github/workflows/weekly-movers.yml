name: Weekly price movers

# A 20-second vertical "price movers" video for DexCompare, RiftCompare, OP Compare and MTG Compare every Monday, for creators
# (competitor scan, owner 2026-11-08). social/movers/pick.mjs reads each site's own public data on GitHub (never Neon, never a
# Vercel build), stage.html is drawn through the daily reel's renderer and music, and the files go to the never-deployed `reels`
# branch under movers/<day>/<site>/, with movers/README.md (the page creators get) and movers/latest.json. Nothing is posted
# anywhere. A site with too few clean moves that week is skipped; the run fails only if every site is.
# Monday 03:10 UTC: after Dex's and MTG's morning imports (~00:45), RiftCompare's (19:00) and OP's snapshot (~23:00), and after
# the daily reel (01:40), which pushes to the same branch.
on:
  schedule:
    - cron: "10 3 * * 1"
  workflow_dispatch:
    inputs:
      sites:
        description: "Sites (space-separated: dex rift op mtg)"
        required: false
        default: "dex rift op mtg"

permissions:
  contents: write

concurrency: reels-branch-movers

jobs:
  movers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-numpy
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Build the videos
        env:
          SITES: ${{ github.event.inputs.sites || 'dex rift op mtg' }}
        run: |
          day=$(date -u +%F); echo "DAY=$day" >> "$GITHUB_ENV"
          made=0
          for s in $SITES; do
            rc=0; bash social/movers/build.sh "out/$day/$s" "$s" || rc=$?
            if [ "$rc" = 0 ]; then made=$((made+1)); else echo "::warning::$s: no video this week (exit $rc)"; rm -rf "out/$day/$s"; fi
          done
          [ "$made" -gt 0 ] || { echo "::error::no site had a video this week"; exit 1; }
      - name: Publish to the reels branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/m && cp -r social/movers /tmp/m/code
          for d in out/$DAY/*/; do s=$(basename "$d"); mkdir -p "/tmp/m/out/$s"; cp "$d"movers.mp4 "$d"cover.png "$d"caption.txt "$d"links.txt "$d"spec.json "/tmp/m/out/$s/"; done
          for i in 1 2 3 4; do
            git fetch -q origin reels || true
            if git rev-parse --verify -q origin/reels >/dev/null; then git checkout -q -f -B reels origin/reels; else git checkout -q --orphan reels && git rm -rfq .; fi
            mkdir -p "movers/$DAY" && cp -r /tmp/m/out/* "movers/$DAY/"
            # Eight weeks kept.
            ls -d movers/????-??-??/ 2>/dev/null | sort | head -n -8 | xargs -r git rm -rq
            node /tmp/m/code/index.mjs movers "$DAY"
            git add movers && git commit -qm "movers $DAY" || true
            git push -q origin reels && exit 0
            sleep $((i*5))
          done
          exit 1
